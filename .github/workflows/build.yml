name: build-psp
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: mkdir -p dist/CurseOfWar && cp EBOOT.PBP dist/CurseOfWar/ && cp -r images dist/CurseOfWar/
      - uses: actions/upload-artifact@v4
        with:
          name: curseofwar-psp
          path: dist
